name: Compilar APK de prueba
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK 35
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar JavaScript de la interfaz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          js=re.search(r'<script>([\s\S]*?)</script>',html)
          if not js: raise SystemExit('No se encontró JavaScript')
          Path('/tmp/pagocheck-v12.js').write_text(js.group(1))
          PY
          node --check /tmp/pagocheck-v12.js
      - name: Preparar firma privada persistente
        env:
          CDP_KEYSTORE_B64: ${{ secrets.CDP_KEYSTORE_B64 }}
          CDP_STORE_PASSWORD: ${{ secrets.CDP_STORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$CDP_KEYSTORE_B64" || -z "$CDP_STORE_PASSWORD" ]]; then
            echo "::error::Faltan los secretos CDP_KEYSTORE_B64 y/o CDP_STORE_PASSWORD. Configure ambos secretos para firmar actualizaciones."
            exit 1
          fi
          printf '%s' "$CDP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/controlpagos-test.jks"
          echo "CDP_KEYSTORE_PATH=$RUNNER_TEMP/controlpagos-test.jks" >> "$GITHUB_ENV"
      - name: Compilar APK firmado estable
        env:
          CDP_STORE_PASSWORD: ${{ secrets.CDP_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar firma APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest'
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PagoCheck-IA-v12-OCR-Local-Premium-Prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
