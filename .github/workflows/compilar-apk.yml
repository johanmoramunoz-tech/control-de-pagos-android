name: Compilar APK de prueba
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Usar SDK Android preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Instalar Android 35
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar JavaScript de la interfaz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          js=re.search(r'<script>([\s\S]*?)</script>',html)
          if not js: raise SystemExit('No se encontró JavaScript')
          Path('/tmp/control-pagos-v7.js').write_text(js.group(1))
          PY
          node --check /tmp/control-pagos-v6.js
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Pagos-v7-APK-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
