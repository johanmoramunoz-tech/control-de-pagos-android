name: Preparar AAB firmado para Google Play
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab-play:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Comprobar configuración de firma Play (sin mostrar claves)
        env:
          PC_UPLOAD_KEYSTORE_B64: ${{ secrets.PC_UPLOAD_KEYSTORE_B64 }}
          PC_UPLOAD_STORE_PASSWORD: ${{ secrets.PC_UPLOAD_STORE_PASSWORD }}
          PC_UPLOAD_KEY_ALIAS: ${{ secrets.PC_UPLOAD_KEY_ALIAS }}
          PC_UPLOAD_KEY_PASSWORD: ${{ secrets.PC_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          for v in PC_UPLOAD_KEYSTORE_B64 PC_UPLOAD_STORE_PASSWORD PC_UPLOAD_KEY_ALIAS PC_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Falta el secreto $v. Genera y registra una clave de carga exclusiva para Play antes de lanzar el workflow."
              exit 1
            fi
          done
          printf '%s' "$PC_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pagocheck-play-upload.jks"
          chmod 600 "$RUNNER_TEMP/pagocheck-play-upload.jks"
          echo "PC_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/pagocheck-play-upload.jks" >> "$GITHUB_ENV"
      - name: Verificar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          js=re.search(r'<script>([\s\S]*?)</script>',html)
          if not js: raise SystemExit('JavaScript no encontrado')
          Path('/tmp/pagocheck-play.js').write_text(js.group(1))
          PY
          node --check /tmp/pagocheck-play.js
      - name: Pruebas financieras y de seguridad
        shell: bash
        run: |
          set -e
          for test in tests/*.test.cjs; do node --test "$test"; done
      - name: Generar AAB Release firmado
        env:
          PC_UPLOAD_STORE_PASSWORD: ${{ secrets.PC_UPLOAD_STORE_PASSWORD }}
          PC_UPLOAD_KEY_ALIAS: ${{ secrets.PC_UPLOAD_KEY_ALIAS }}
          PC_UPLOAD_KEY_PASSWORD: ${{ secrets.PC_UPLOAD_KEY_PASSWORD }}
          PC_FIREBASE_APP_ID: ${{ secrets.PC_FIREBASE_APP_ID }}
          PC_FIREBASE_API_KEY: ${{ secrets.PC_FIREBASE_API_KEY }}
          PC_FIREBASE_PROJECT_ID: ${{ secrets.PC_FIREBASE_PROJECT_ID }}
        run: gradle --no-daemon :app:bundleRelease
      - name: Verificar firma y estructura de AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify -verbose "$AAB" | tee "$RUNNER_TEMP/aab-verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-verify.txt"
          echo "AAB Release firmado verificado. No se exponen claves ni contraseñas."
      - name: Adjuntar AAB para subir manualmente a Play Console
        uses: actions/upload-artifact@v4
        with:
          name: PagoCheck-IA-v25-AAB-Play-Interna
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
