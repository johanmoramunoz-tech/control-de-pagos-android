<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#113a70"><title>Control de Pagos — Prueba local</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182d49;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:800px;margin:auto;padding:0 13px 92px}header{background:linear-gradient(115deg,#081d43,#185ea3 52%,#071b41);color:white;padding:19px 18px 21px;border-radius:0 0 24px 24px;box-shadow:0 8px 23px #082f5533;margin:0 -13px 15px}header small{letter-spacing:.08em;text-transform:uppercase;color:#c1dcfa}header h1{margin:4px 0 14px;font-size:24px}.months{display:flex;align-items:center;justify-content:space-between;background:#ffffff1e;border:1px solid #ffffff32;padding:6px;border-radius:13px}.months button{width:37px;height:37px;border:0;background:#ffffff24;color:white;border-radius:10px;font-size:22px}.tabs{display:flex;gap:6px;overflow:auto;padding:3px 0 15px}.tabs button{border:1px solid #c6d7eb;background:white;padding:10px 13px;border-radius:20px;white-space:nowrap;color:#1b5085;font-size:13px;font-weight:650}.tabs button.active{background:linear-gradient(120deg,#103d74,#2679c0);color:white;border-color:#1f68a8}.banner{border-radius:13px;background:#e8effa;border:1px solid #ccdbef;padding:11px;color:#305477;font-size:12px;line-height:1.5;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.panel,.item{background:white;border:1px solid #d9e3ef;border-radius:15px;padding:14px;box-shadow:0 2px 9px #234f7710}.tile small{display:block;color:#687c92;font-size:12px}.tile strong{font-size:20px;display:block;margin-top:5px;overflow-wrap:anywhere}h2{font-size:18px;margin:20px 0 10px}.head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:15px 0 10px}.head h2{margin:0}.button{color:white;background:linear-gradient(120deg,#123e74,#2379c0);border:0;border-radius:10px;padding:10px 13px;font-weight:700}.outline{border:1px solid #bed4ee;background:#edf5ff;color:#15518b}.danger{color:#a32c33}.positive{color:#1263a0}.entries{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:flex-start}.item .symbol{width:38px;height:38px;border-radius:11px;background:#e7f0fe;color:#12558e;display:grid;place-items:center;flex-shrink:0;font-size:19px}.item .body{flex:1;min-width:0}.item .name{font-weight:750;font-size:14px}.sub{color:#688098;font-size:12px;line-height:1.5;margin-top:4px}.amount{font-weight:780;white-space:nowrap;font-size:14px}.actions{display:flex;gap:5px;justify-content:flex-end;margin-top:7px;flex-wrap:wrap}.mini{font-size:11px;border:1px solid #cbdbea;border-radius:7px;padding:6px 8px;background:#f4f8fe;color:#225783}.empty{background:white;border:1px dashed #ccd8e8;border-radius:14px;padding:25px;text-align:center;color:#667b94;font-size:14px}.stack{display:grid;gap:10px}.muted{font-size:12px;color:#657b95;line-height:1.55}.status{display:inline-block;font-size:10px;border-radius:7px;padding:3px 6px;background:#e7f0ff;color:#215c90;margin-left:4px}.status.warn{background:#fff0e8;color:#a14d12}.progress{height:9px;background:#dce5f0;border-radius:20px;overflow:hidden;margin-top:9px}.progress>div{background:linear-gradient(90deg,#183f79,#4295df);height:100%}.bottom{margin:20px 0;display:flex;gap:8px;flex-wrap:wrap}.bottom button{border:1px solid #c7d8e8;border-radius:10px;background:white;padding:10px;color:#245a8a}.overlay{position:fixed;inset:0;background:#06172bad;z-index:5;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.modal{background:white;border-radius:23px 23px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:20px}.modal h2{margin:1px 0 16px}.formrow{margin:11px 0}.formrow label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.formrow input,.formrow select,.formrow textarea{width:100%;border:1px solid #becfe1;border-radius:10px;padding:12px;background:white;color:#1b304b}.formpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalfoot{display:flex;gap:9px;margin-top:16px}.modalfoot button{flex:1}.nowrap{white-space:nowrap}table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px 4px;border-bottom:1px solid #e5edf5}td:last-child{text-align:right;font-weight:700}.footer{font-size:11px;color:#667f9a;line-height:1.6;margin-top:19px}@media(max-width:370px){.tile strong{font-size:16px}.formpair{grid-template-columns:1fr}}@media(min-width:620px){.overlay{align-items:center}.modal{border-radius:18px}}
</style></head><body><main><header><small>Presupuesto familiar · Versión 5 · prueba local</small><h1>Control de Pagos</h1><div class="months"><button id="prev" aria-label="Mes anterior">‹</button><strong id="currentMonth"></strong><button id="next" aria-label="Mes siguiente">›</button></div></header><div class="tabs" id="tabs"><button data-tab="home">Resumen</button><button data-tab="obligations">Compromisos</button><button data-tab="movements">Movimientos</button><button data-tab="closing">Cierre</button><button data-tab="ai">Planes e IA</button><button data-tab="settings">Ajustes</button></div><div class="banner">Modo de prueba local: los registros se guardan solamente en este dispositivo. <strong>Sin sincronización familiar, pagos reales en Play Store, Drive ni IA externa conectados.</strong> No ingreses datos financieros sensibles reales para pruebas.</div><section id="view"></section></main><div id="overlay" class="overlay"><section class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><form id="form"><div id="formFields"></div><div class="modalfoot"><button class="button outline" type="button" id="cancel">Cancelar</button><button class="button" type="submit">Guardar</button></div></form></section></div><input type="file" id="backupFile" accept="application/json,.json" hidden><script>
'use strict';
const KEY='control-pagos-v4-demo', $=id=>document.getElementById(id),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},monthNow=()=>today().slice(0,7),uuid=()=>globalThis.crypto?.randomUUID?.()||'id'+Date.now()+Math.random().toString(36).slice(2),crc=n=>'₡'+Math.round(n||0).toLocaleString('es-CR'),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),numeric=v=>Number.isFinite(Number(v))?Number(v):0;
let month=monthNow(),tab='home',callback=null,db={schema:4,commitments:[],transactions:[],monthClosed:{},audit:[]};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.schema===4&&Array.isArray(saved.commitments)&&Array.isArray(saved.transactions)&&saved.monthClosed&&Array.isArray(saved.audit))db=saved}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('No fue posible guardar. Revisa el almacenamiento.');return false}}
function logging(action,extra={}){db.audit.push({id:uuid(),timestamp:new Date().toISOString(),action,...extra});if(db.audit.length>10000)db.audit=db.audit.slice(-10000)}
function currentCommitments(){return db.commitments.filter(c=>c.start<=month&&(!c.end||c.end>=month))}
function ledger(){return db.transactions.filter(t=>t.month===month&&!t.reversed)}
function related(c){return ledger().filter(t=>t.commitmentId===c.id&&t.kind===c.kind)}
function target(c){return Object.hasOwn(c.overrides||{},month)?c.overrides[month]:c.estimate}
function executed(c){return related(c).reduce((a,t)=>a+t.amount,0)}
function summary(){const c=currentCommitments(),tx=ledger(),plannedInc=c.filter(x=>x.kind==='income').reduce((a,x)=>a+target(x),0),plannedExp=c.filter(x=>x.kind==='expense').reduce((a,x)=>a+target(x),0),realInc=tx.filter(x=>x.kind==='income').reduce((a,x)=>a+x.amount,0),realExp=tx.filter(x=>x.kind==='expense').reduce((a,x)=>a+x.amount,0);return {plannedInc,plannedExp,realInc,realExp,pending:c.filter(x=>x.kind==='expense').reduce((a,x)=>a+Math.max(0,target(x)-executed(x)),0),c,tx}}
function tile(label,n){return `<div class="tile"><small>${label}</small><strong>${crc(n)}</strong></div>`}
function section(title,button='',kind=''){return `<div class="head"><h2>${title}</h2>${button?`<button class="button" data-add="${kind}">${button}</button>`:''}</div>`}
function status(c){const paid=executed(c),amount=target(c);return paid>=amount&&paid>0?'Pagado':paid>0?'Parcial':'Pendiente'}
function listCommitments(arr){if(!arr.length)return '<div class="empty">Todavía no hay compromisos para este mes.</div>';return `<div class="entries">${arr.map(c=>{const amt=target(c),paid=executed(c),st=status(c);return `<article class="item"><div class="symbol">${c.kind==='income'?'↗':c.category==='Transporte'?'▰':'▣'}</div><div class="body"><div class="name">${safe(c.name)} <span class="status ${st==='Pendiente'?'warn':''}">${st}</span></div><div class="sub">${safe(c.category)} · ${c.kind==='income'?'Ingreso día '+c.due:'Corte '+(c.cut||'—')+' · Vence '+c.due}<br>Previsto ${crc(amt)} · Ejecutado ${crc(paid)}${c.kind==='expense'?` · Falta ${crc(Math.max(0,amt-paid))}`:''}</div><div class="progress"><div style="width:${Math.max(0,Math.min(100,amt?paid/amt*100:paid?100:0))}%"></div></div><div class="actions"><button class="mini" data-abono="${safe(c.id)}">${c.kind==='income'?'Registrar ingreso':'Añadir pago'}</button><button class="mini" data-edit="${safe(c.id)}">Editar</button></div></div></article>`}).join('')}</div>`}
function listTransactions(a){if(!a.length)return '<div class="empty">No hay movimientos reales registrados para este mes.</div>';return `<div class="entries">${[...a].sort((a,b)=>b.date.localeCompare(a.date)||b.recordedAt.localeCompare(a.recordedAt)).map(t=>`<article class="item"><div class="symbol">${t.source==='voice'?'♬':t.source==='photo'?'▧':t.kind==='income'?'↗':'↘'}</div><div class="body"><div class="name">${safe(t.description)}</div><div class="sub">${safe(t.date)} · ${safe(t.category)} · ${t.source==='manual'?'Manual':t.source==='voice'?'Voz (declarado)':t.source==='photo'?'Foto (declarado)':safe(t.source)}<br>Por: ${safe(t.author||'Usuario local')} · ${safe(t.note||'Sin comprobante verificado')}</div></div><div style="text-align:right"><div class="amount ${t.kind==='income'?'positive':'danger'}">${t.kind==='income'?'+':'−'}${crc(t.amount)}</div><div class="actions"><button class="mini" data-reverse="${safe(t.id)}">Reversar</button></div></div></article>`).join('')}</div>`}
function locked(){if(db.monthClosed[month]){alert('Este mes está cerrado. Reábrelo desde la pestaña Cierre para añadir o corregir movimientos.');return true}return false}
function render(){const s=summary();$('currentMonth').textContent=new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1,1).toLocaleDateString('es-CR',{month:'long',year:'numeric'});document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let html='';if(tab==='home'){html=`<div class="grid">${tile('Ingresos proyectados',s.plannedInc)}${tile('Gastos proyectados',s.plannedExp)}${tile('Ingresos recibidos',s.realInc)}${tile('Gastos ejecutados',s.realExp)}${tile('Balance de movimientos',s.realInc-s.realExp)}${tile('Compromisos pendientes',s.pending)}</div><p class="muted">Balance de movimientos ≠ saldo bancario. Para un saldo disponible se necesita saldo inicial conciliado y conciliación por cuenta.</p>${section('Próximos compromisos','+ Añadir','expense')}${listCommitments(s.c.filter(c=>c.kind==='expense'&&executed(c)<target(c)))}${section('Movimientos recientes')}${listTransactions(s.tx.slice(-5))}`}
if(tab==='obligations'){html=`${section('Ingresos proyectados','+ Ingreso','income')}${listCommitments(s.c.filter(c=>c.kind==='income'))}${section('Gastos obligatorios','+ Gasto','expense')}${listCommitments(s.c.filter(c=>c.kind==='expense'))}`}
if(tab==='movements'){html=`${section('Ingresos y egresos reales','+ Movimiento','free')}${listTransactions(s.tx)}<div class="bottom"><button data-add="voice">🎙 Dictar o escribir un gasto</button><button data-add="photo">▧ Registrar fotografía (manual)</button></div><p class="muted">La transcripción de voz puede utilizar el reconocedor de Android si está disponible; la interpretación del gasto es local y limitada. Las fotografías siguen requiriendo entrada manual y no se verifican.</p>`}
if(tab==='closing'){const c=db.monthClosed[month];html=`<h2>Informe de ${safe($('currentMonth').textContent)}</h2><div class="panel"><table><tbody><tr><td>Ingresos proyectados</td><td>${crc(s.plannedInc)}</td></tr><tr><td>Ingresos ejecutados</td><td>${crc(s.realInc)}</td></tr><tr><td>Gastos proyectados</td><td>${crc(s.plannedExp)}</td></tr><tr><td>Gastos ejecutados</td><td>${crc(s.realExp)}</td></tr><tr><td>Balance presupuestado</td><td>${crc(s.plannedInc-s.plannedExp)}</td></tr><tr><td>Balance ejecutado registrado</td><td>${crc(s.realInc-s.realExp)}</td></tr><tr><td>Obligaciones pendientes</td><td>${crc(s.pending)}</td></tr></tbody></table></div><div class="bottom"><button class="button" id="closeMonth">${c?'Reabrir mes':'Cerrar mes'}</button></div><p class="muted">${c?'Mes cerrado el '+safe(c.closedAt)+'. Su informe queda como una instantánea local, pero puede reabrirse en este prototipo.':'El cierre bloquea nuevos registros del mes. No equivale a conciliación bancaria ni a cierre contable certificado.'}</p>`}
if(tab==='ai'){html=`<h2>Planes de Control de Pagos</h2><div class="stack">
  <article class="panel"><strong>Gratis · activo</strong><p class="muted">Presupuesto, compromisos, movimientos reales, abonos, cierre mensual y respaldo local. Sin IA.</p><span class="status">Plan actual de prueba</span></article>
  <article class="panel"><strong>Plus · IA propia</strong><p class="muted">Compra única prevista: permite que el usuario conecte un asistente externo compatible mediante un conector seguro, o configure una API propia. Ni ChatGPT Plus ni Gemini Advanced equivalen a crédito API.</p><span class="status warn">Sin compras ni conector habilitado</span></article>
  <article class="panel"><strong>Premium · IA incluida</strong><p class="muted">Suscripción futura, con cuotas de procesamiento y un servicio seguro que proteja las claves. Los importes y cuotas no están fijados.</p><span class="status warn">No disponible en esta prueba</span></article>
  <article class="panel"><strong>Canales previstos</strong><p class="muted">ChatGPT / MCP · Gemini / conector compatible · API personal BYOK · IA administrada. Ninguno está conectado. La voz básica del teléfono es independiente de estos planes.</p></article>
  </div><h2>Estado técnico</h2><div class="panel"><p class="muted">Interfaz y registros: locales. Google Sign-In, Firestore, Drive, facturación de Google Play y conectores: requieren credenciales, despliegue de servicios y pruebas.</p></div>`}
if(tab==='settings'){html=`<h2>Datos y respaldos</h2><div class="panel"><p class="muted">Versión 5.0 de prueba local. Los datos residen en el almacenamiento de esta instalación del navegador o WebView.</p><div class="bottom"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><button id="wipe">Borrar datos locales</button></div><p class="muted">Los respaldos JSON no están cifrados; no los compartas públicamente. Los servicios de nube, compras y proveedores externos de IA no están conectados. La prueba no procesa datos mediante IA.</p></div><h2>Bitácora</h2><div class="panel">${db.audit.slice(-15).reverse().map(a=>`<div class="sub">${safe(a.timestamp)} · ${safe(a.action)}</div>`).join('')||'<p class="muted">Sin eventos todavía.</p>'}</div>`}
$('view').innerHTML=html;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>b.dataset.add==='voice'?openVoice():b.dataset.add==='photo'?openFree('photo'):b.dataset.add==='free'?openFree('manual'):openCommitment(b.dataset.add));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCommitment(null,b.dataset.edit));document.querySelectorAll('[data-abono]').forEach(b=>b.onclick=()=>openPayment(b.dataset.abono));document.querySelectorAll('[data-reverse]').forEach(b=>b.onclick=()=>reverse(b.dataset.reverse));if($('closeMonth'))$('closeMonth').onclick=()=>{if(db.monthClosed[month]){if(!confirm('¿Reabrir el mes para registrar cambios?'))return;delete db.monthClosed[month];logging('Mes reabierto',{month})}else{if(!confirm('¿Cerrar este mes? No podrás registrar movimientos hasta reabrirlo.'))return;db.monthClosed[month]={closedAt:new Date().toISOString(),snapshot:summary()};logging('Mes cerrado',{month})}persist();render()};if($('export'))$('export').onclick=exportData;if($('import'))$('import').onclick=()=>window.AndroidBackup?.importData?window.AndroidBackup.importData():$('backupFile').click();if($('wipe'))$('wipe').onclick=()=>{if(confirm('¿Borrar definitivamente todos los datos locales de prueba? Exporta primero un respaldo.')){db={schema:4,commitments:[],transactions:[],monthClosed:{},audit:[]};persist();render()}}}
const field=(id,title,type='text',value='',more='')=>`<div class="formrow"><label for="f_${id}">${title}</label><input id="f_${id}" type="${type}" value="${safe(value)}" ${more}></div>`;function popup(title,fields,fn){callback=fn;$('modalTitle').textContent=title;$('formFields').innerHTML=fields;$('overlay').classList.add('open');}
function openCommitment(kind,edit){if(locked())return;const c=db.commitments.find(x=>x.id===edit);kind=c?.kind||kind;popup(edit?'Editar compromiso':kind==='income'?'Nuevo ingreso previsto':'Nuevo gasto obligatorio',field('name','Descripción','text',c?.name||'','required maxlength="100"')+field('estimate','Monto proyectado en colones','number',c?.estimate??'','min="0" max="1000000000" step="1" required')+`<div class="formpair">${field('cut','Día de corte (0 si no aplica)','number',c?.cut??0,'min="0" max="31"')}${field('due',kind==='income'?'Día esperado':'Fecha máxima (día)','number',c?.due??15,'required min="1" max="31"')}</div>`+`<div class="formrow"><label for="f_category">Categoría</label><select id="f_category">${(kind==='income'?['Salario','Otros ingresos','Reembolsos']:['Préstamos','Servicios','Vivienda','Alimentación','Transporte','Educación','Salud','Otros']).map(x=>`<option ${x===c?.category?'selected':''}>${x}</option>`).join('')}</select></div><p class="muted">El monto proyectado sirve para meses futuros. Los pagos reales se registran por separado como abonos.</p>`,()=>{const name=$('f_name').value.trim(),estimate=Number($('f_estimate').value),cut=Number($('f_cut').value),due=Number($('f_due').value);if(!name||!Number.isInteger(estimate)||estimate<0||estimate>1e9||!Number.isInteger(cut)||cut<0||cut>31||!Number.isInteger(due)||due<1||due>31){alert('Comprueba nombre, monto y días.');return false}if(c){Object.assign(c,{name,estimate,cut,due,category:$('f_category').value})}else db.commitments.push({id:uuid(),kind,name,estimate,cut,due,category:$('f_category').value,start:month,end:null,overrides:{}});logging(c?'Compromiso editado':'Compromiso creado',{month});return persist()})}
function addTx(t){db.transactions.push({id:uuid(),recordedAt:new Date().toISOString(),month:month,...t,reversed:false});logging('Movimiento registrado',{month,source:t.source,kind:t.kind});return persist()}
function openPayment(id){if(locked())return;const c=db.commitments.find(x=>x.id===id);if(!c)return;const rest=Math.max(0,target(c)-executed(c));popup(c.kind==='income'?'Registrar ingreso':'Registrar pago o abono',`<p class="muted"><strong>${safe(c.name)}</strong> · Proyectado ${crc(target(c))} · Ya registrado ${crc(executed(c))} · Restante ${crc(rest)}</p>`+field('amount','Monto real recibido/pagado (₡)','number',rest,'required min="1" max="1000000000" step="1"')+field('date','Fecha efectiva','date',today(),'required')+field('note','Referencia u observación','text','','maxlength="200"'),()=>{const n=Number($('f_amount').value),date=$('f_date').value;if(!Number.isInteger(n)||n<=0||n>1e9||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Monto o fecha inválida.');return false}return addTx({commitmentId:c.id,kind:c.kind,amount:n,date,description:c.name,category:c.category,source:'manual',author:'Usuario local',note:$('f_note').value.trim()})})}
function openFree(source){if(locked())return;popup(source==='photo'?'Registrar movimiento desde fotografía':'Nuevo movimiento real',`<div class="formrow"><label for="f_kind">Tipo</label><select id="f_kind"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></div>`+field('description','Concepto','text','','required maxlength="100"')+field('amount','Monto real (₡)','number','','required min="1" max="1000000000" step="1"')+field('date','Fecha efectiva','date',today(),'required')+`<div class="formrow"><label for="f_category">Categoría</label><select id="f_category">${['Transporte','Alimentación','Servicios','Vivienda','Préstamos','Salario','Salud','Educación','Otros'].map(x=>`<option>${x}</option>`).join('')}</select></div>`+field('note','Referencia o detalle','text','','maxlength="200"')+`<p class="muted">${source==='photo'?'Esta versión no lee imágenes automáticamente ni conserva fotografías: registra el origen como fotografía declarada, sin evidencia adjunta.':'Registro manual que afecta el balance real, sin asociarse a un compromiso.'}</p>`,()=>{let desc=$('f_description').value.trim(),amount=Number($('f_amount').value),date=$('f_date').value;if(!desc||!Number.isInteger(amount)||amount<=0||amount>1e9||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Revisa concepto, monto y fecha.');return false}return addTx({kind:$('f_kind').value,description:desc,amount,date,category:$('f_category').value,source,author:'Usuario local',note:$('f_note').value.trim(),commitmentId:null})})}
function openVoice(){if(locked())return;popup('Dictado o escritura de gasto',`<p class="muted">En el APK, pulsa Dictar con Android para reconocer la voz. También puedes escribir «registra 25000 colones de combustible». La categoría se deduce con reglas básicas locales, no mediante IA.</p><button class="button outline" type="button" onclick="startNativeVoice()">🎙 Dictar con Android</button>`+field('phrase','Instrucción reconocida o escrita','text','','required maxlength="220"'),()=>{const p=$('f_phrase').value.trim(),match=p.match(/(\d[\d.,\s]*)\s*(?:colones|₡)?/i);if(!match){alert('No pude reconocer el monto. Usa números: 25000.');return false}let raw=match[1].replace(/[^\d]/g,''),amount=Number(raw);if(!Number.isInteger(amount)||amount<=0||amount>1e9){alert('Monto inválido.');return false}const desc=p.toLowerCase().includes('combustible')?'Combustible':p.toLowerCase().includes('aliment')?'Alimentación':'Gasto por voz';return addTx({kind:'expense',description:desc,amount,date:today(),category:desc==='Combustible'?'Transporte':desc==='Alimentación'?'Alimentación':'Otros',source:'voice',author:'Usuario local',note:'Texto proporcionado: '+p.slice(0,150),commitmentId:null})})}
function startNativeVoice(){if(window.AndroidAI?.startSpeechRecognition){window.AndroidAI.startSpeechRecognition()}else{alert('Dictado nativo disponible solo en el APK. En el navegador, escribe la instrucción.') }} function receiveVoiceTranscript(v){const el=document.getElementById('f_phrase');if(el)el.value=String(v).slice(0,220)}
function reverse(id){if(locked())return;const t=db.transactions.find(x=>x.id===id);if(!t||t.reversed||!confirm('¿Reversar este movimiento? Se conservará en el historial de auditoría.'))return;t.reversed=true;t.reversedAt=new Date().toISOString();logging('Movimiento reversado',{movementId:id,month});persist();render()}
function exportData(){let content=JSON.stringify(db,null,2);if(window.AndroidBackup?.exportData){window.AndroidBackup.exportData(content);return}const blob=new Blob([content],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='control-pagos-v5-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function receiveBackup(content){try{const v=JSON.parse(content);if(!v||v.schema!==4||!Array.isArray(v.commitments)||!Array.isArray(v.transactions)||!Array.isArray(v.audit)||typeof v.monthClosed!=='object'||JSON.stringify(v).length>5000000)throw Error('Formato incompatible');if(!confirm('¿Reemplazar todos los datos locales con el respaldo?'))return;db=v;if(!persist())throw Error('No fue posible guardar');render();alert('Importación realizada')}catch(e){alert('Respaldo inválido: '+e.message)}}
function close(){callback=null;$('overlay').classList.remove('open')}function closeDialogOrBack(){if($('overlay').classList.contains('open'))close();else if(tab!=='home'){tab='home';render()}else{month=monthNow();render()}}
$('form').onsubmit=e=>{e.preventDefault();if(callback&&callback()!==false){close();render()}};$('cancel').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);function move(n){const[y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});$('backupFile').onchange=async e=>{const f=e.target.files[0];if(f)receiveBackup(await f.text());e.target.value=''};render();
</script></body></html>
