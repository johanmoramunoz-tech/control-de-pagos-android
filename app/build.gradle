plugins { id 'com.android.application' }
def stableKeyPath = System.getenv('CDP_KEYSTORE_PATH')
def stablePass = System.getenv('CDP_STORE_PASSWORD')
android {
 namespace 'cr.controles.pagos'
 compileSdk 35
 defaultConfig {
  applicationId 'cr.controles.pagos'
  minSdk 24
  targetSdk 35
  versionCode 12
  versionName '12.0-ocr-local'
 }
 signingConfigs {
  if(stableKeyPath && stablePass) {
   stableTest {
    storeFile file(stableKeyPath)
    storePassword stablePass
    keyAlias 'controlpagos'
    keyPassword stablePass
    storeType 'pkcs12'
   }
  }
 }
 buildTypes {
  debug {
   if(stableKeyPath && stablePass) signingConfig signingConfigs.stableTest
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}

dependencies {
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'androidx.core:core:1.13.1'
}
